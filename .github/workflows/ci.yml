name: Branch CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  release-chain:
    name: Release chain (database-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI: "true"
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release ordering
        run: env -u DATABASE_URL pnpm run test:release-chain

  build:
    name: Build and static checks
    needs: release-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run build and database-free publish checks
        run: env -u DATABASE_URL pnpm run validate:ci:build

  database:
    name: Database checks (isolated PostgreSQL)
    needs: release-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://lumera_ci:lumera_ci@localhost:5432/lumera_ci_database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumera_ci
          POSTGRES_PASSWORD: lumera_ci
          POSTGRES_DB: lumera_ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumera_ci -d lumera_ci_database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated test schema
        run: pnpm --filter @workspace/db run push-force
      - name: Run database checks
        run: pnpm run validate:ci:database

  browser:
    name: Browser user journeys
    needs:
      - release-chain
      - build
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://lumera_ci:lumera_ci@localhost:5432/lumera_ci_browser
      SESSION_SECRET: lumera-ci-browser-only-session-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumera_ci
          POSTGRES_PASSWORD: lumera_ci
          POSTGRES_DB: lumera_ci_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumera_ci -d lumera_ci_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium
      - name: Prepare isolated browser test schema
        run: pnpm --filter @workspace/db run push-force
      - name: Run browser user journeys
        run: pnpm run validate:ci:browser
      - name: Upload browser failure diagnostics
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ github.run_attempt }}
          path: |
            scripts/playwright-report/
            scripts/test-results/
          if-no-files-found: warn
          retention-days: 7
