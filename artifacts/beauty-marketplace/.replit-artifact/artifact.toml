kind = "web"
previewPath = "/"
title = "LUMERA — Beauty & Wellness Marketplace"
description = "A Serbian beauty, wellness, massage, salon, education, and professional supplies marketplace connecting customers with trusted providers and helping salons grow through bookings, CRM, loyalty, B2B shopping, and education."
version = "1.0.0"
id = "artifacts/beauty-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23561

[services.development]
run = "pnpm --filter @workspace/beauty-marketplace run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/beauty-marketplace", "run", "build"]

[services.production.run]
args = ["node", "artifacts/beauty-marketplace/seo-server.mjs"]

[services.production.run.env]
PORT = "23561"
NODE_ENV = "production"
LUMERA_PUBLIC_URL = "https://beauty-partner-hub.replit.app"
LUMERA_SEO_API_ORIGIN = "http://127.0.0.1:8080"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "23561"
BASE_PATH = "/"
