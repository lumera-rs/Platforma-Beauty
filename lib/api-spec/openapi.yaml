        completedCount: { type: number }
        lastVisitDaysAgo: { type: ["number", "null"] }
        typicalIntervalDays: { type: ["number", "null"] }
        totalSpend: { type: number }
        hasFutureAppointment: { type: boolean }
        explanation: { type: string }
        recommendedAction: { type: string }
      required: [salonCustomerId, firstName, lastName, status, completedCount, totalSpend, hasFutureAppointment, explanation, recommendedAction]

