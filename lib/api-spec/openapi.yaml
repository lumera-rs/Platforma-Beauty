  /growth/admin/summary:
    get:
      operationId: adminGetGrowthSummary
      tags: [growth]
      summary: Platform-wide growth summary for admin (read-only, no mutation)
      responses:
        "200":
          description: Platform growth summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthAdminSummary" }
        "403": { description: Admin access required }

  /growth/admin/retention-settings:
    get:
      operationId: adminGetRetentionSettings
      tags: [growth]
      summary: Active platform retention classification thresholds (admin)
      responses:
        "200":
          description: Active retention settings (version 0 = platform defaults)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
    put:
      operationId: adminUpdateRetentionSettings
      tags: [growth]
      summary: Update platform retention thresholds (admin); records an audited new version. Requires the expected active version (optimistic concurrency) — a stale version is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionSettingsUpdate" }
      responses:
        "200":
          description: Newly active retention settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettings" }
        "400": { description: Validation error (out-of-range or inconsistent thresholds) }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "409":
          description: Another admin saved a newer version since the client last loaded the settings; refetch and re-confirm
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettingsVersionConflict" }

  /growth/admin/retention-settings/preview:
    post:
      operationId: adminPreviewRetentionSettings
      tags: [growth]
      summary: Dry-run candidate retention thresholds against current data (admin); never persists a settings version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionThresholds" }
      responses:
        "200":
          description: Platform-wide per-status counts under current vs. candidate thresholds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionSettingsPreview" }
        "400": { description: Validation error (out-of-range or inconsistent thresholds) }
        "401": { description: Authentication required }
        "403": { description: Admin access required }
        "503": { description: Preview temporarily unavailable — dataset exceeds the row-count cap or the computation exceeded its time budget (friendly message in `error`) }

  /growth/admin/retention-settings/history:
    get:
      operationId: adminGetRetentionSettingsHistory
      tags: [growth]
      summary: Audit history of retention threshold changes (admin), newest first
      responses:
        "200":
          description: Change history with previous values per entry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RetentionSettingsHistoryEntry" }
        "401": { description: Authentication required }
        "403": { description: Admin access required }

components:
  parameters:
    CityQuery:
      name: city
      in: query
      schema: { type: string }
    CategoryQuery:
      name: category
      in: query
      schema: { type: string }
    TreatmentQuery:
      name: treatment
      in: query
      schema: { type: string }
    SortQuery:
      name: sort
      in: query
      schema: { type: string, enum: [recommended, top-rated, cheapest, largest-discount, nearest, first-available, most-popular, most-booked-recently, newest], default: recommended }
    SalonSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SalonId:
      name: salonId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string }
    EducationCenterId:
      name: centerId
      in: path
      required: true
      schema: { type: string }
