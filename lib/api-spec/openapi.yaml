openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LUMERA beauty, wellness, booking, B2B, loyalty, and education marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: salons
  - name: appointments
  - name: customer
  - name: salon-management
  - name: shop
  - name: loyalty
  - name: education
  - name: admin
  - name: growth

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/business-register:
    post:
      operationId: registerBusiness
      tags: [auth]
      summary: Register a salon or education-center owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRegistrationInput"
      responses:
        "201":
          description: Registered business owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /auth/sign-in-methods:
    get:
      operationId: getAuthSignInMethods
      tags: [auth]
      summary: List connected sign-in methods for the current user
      responses:
        "200":
          description: Connected sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "401": { description: Authentication required }
  /auth/sign-in-methods/{provider}:
    delete:
      operationId: disconnectAuthSignInMethod
      tags: [auth]
      summary: Disconnect a social sign-in method from the current user
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "200":
          description: Updated connected sign-in methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "400": { description: Disconnecting would leave the account without a sign-in method }
        "401": { description: Authentication required }
        "404": { description: Provider is not connected }
  /admin/email-marketing/campaigns:
    get:
      operationId: adminListEmailCampaigns
      tags: [admin]
      summary: List LUMERA email marketing campaigns
      responses:
        "200":
          description: Campaign history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListEmailCampaignsResponse"
    post:
      operationId: adminCreateEmailCampaign
      tags: [admin]
      summary: Create and send or schedule an email campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateEmailCampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMarketingCampaign"
  /admin/sms-deliveries:
    get:
      operationId: adminListSmsDeliveries
      tags: [admin]
      summary: List transactional SMS delivery records
      responses:
        "200":
          description: SMS delivery log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SmsDelivery" }
  /salons:
    get:
      operationId: listSalons
      tags: [salons]
      summary: Search salons
      parameters:
        - $ref: "#/components/parameters/CityQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/TreatmentQuery"
        - $ref: "#/components/parameters/SortQuery"
        - name: priceMax
          in: query
          schema: { type: number }
        - name: municipality
          in: query
          schema: { type: string }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: minReviewCount
          in: query
          schema: { type: number, minimum: 0 }
        - name: availability
          in: query
          schema: { type: string, enum: [today, tomorrow, this-week] }
        - name: homeService
          in: query
          schema: { type: boolean }
        - name: gender
          in: query
          schema: { type: string, enum: [all, women, men, everyone] }
        - name: discountsOnly
          in: query
          schema: { type: boolean }
        - name: acceptsCards
          in: query
          schema: { type: boolean }
        - name: openSunday
          in: query
          schema: { type: boolean }
        - name: instantBooking
          in: query
          schema: { type: boolean }
        - name: topSalon
          in: query
          schema: { type: boolean }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: brand
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number }
        - name: longitude
          in: query
          schema: { type: number }
        - name: page
          in: query
          description: 1-based page number. All filters and the chosen sort are applied in SQL BEFORE this page is selected.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of salons per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: One page of salon results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
  /discovery/home:
    get:
      operationId: getMarketplaceHomeDiscovery
      tags: [salons]
      summary: Get curated public discovery content for the marketplace homepage
      parameters:
        - $ref: "#/components/parameters/CityQuery"
      responses:
        "200":
          description: City-aware discovery shelves and popular services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceHomeDiscovery" }
  /cities:
    get:
      operationId: listCities
      tags: [salons]
      summary: List cities that have active salons with salon counts
      responses:
        "200":
          description: Cities derived from active salons, ordered deterministically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CitySummary" }
  /platform/trust-stats:
    get:
      operationId: getPlatformTrustStats
      tags: [salons]
      summary: Get public marketplace trust statistics
      responses:
        "200":
          description: Aggregated marketplace trust statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformTrustStats" }
  /salons/{slug}:
    get:
      operationId: getSalon
      tags: [salons]
      summary: Get salon profile
      parameters:
        - $ref: "#/components/parameters/SalonSlug"
      responses:
        "200":
          description: Salon profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonProfile"
  /salons/{salonId}/availability:
    get:
      operationId: getSalonAvailability
      tags: [salons]
      summary: Get available booking slots
      parameters:
        - $ref: "#/components/parameters/SalonId"
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: date
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeSlot" }
  /salons/{salonId}/first-available:
    get:
      operationId: getSalonFirstAvailable
      tags: [salons]
      summary: Get the first available slot for every active salon service
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "200":
          description: First available booking slots for active services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonFirstAvailable" }
        "404": { description: Salon not found }
  /appointments:
    get:
      operationId: listMyAppointments
      tags: [appointments]
      summary: List appointments for the signed-in user
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, completed, cancelled, no-show] }
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: all }
        - name: page
          in: query
          description: 1-based page number for stable pagination (date asc, startTime asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of appointments per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          description: >-
            Booking conflict. Package redemption failures carry a stable
            discriminator `code: PACKAGE_ERROR` plus the specific `reason`;
            plain availability conflicts omit `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflictError"
  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Reschedule or update appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{appointmentId}/salon-contact:
    get:
      operationId: getAppointmentSalonContact
      tags: [appointments]
      summary: Get salon contact details for the signed-in customer's qualifying booking
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Private salon contact and exact location for this booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSalonContact"
        "403": { description: The appointment is cancelled or does not belong to the signed-in customer }
        "404": { description: Appointment not found }
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAppointmentInput"
      responses:
        "200":
          description: Cancelled appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /customer/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [customer]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Customer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"
  /customer/favorites:
    get:
      operationId: listFavorites
      tags: [customer]
      summary: List favorite salons
      responses:
        "200":
          description: Favorite salons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
    post:
      operationId: toggleFavorite
      tags: [customer]
      summary: Add or remove a favorite salon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResult"
  /customer/reviews/{salonId}:
    get:
      operationId: getCustomerSalonReview
      tags: [customer]
      summary: Get the current customer's review and completed services for a salon
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "200":
          description: Customer review context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSalonReviewContext" }
        "403": { description: Customer access required }
        "404": { description: Salon not found }
    put:
      operationId: upsertCustomerSalonReview
      tags: [customer]
      summary: Create or update the current customer's review for a completed salon visit
      parameters:
        - $ref: "#/components/parameters/SalonId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerReviewInput" }
      responses:
        "200":
          description: Saved customer review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerReview" }
        "400": { description: Invalid review }
        "403": { description: Customer access required }
        "404": { description: Salon not found }
    delete:
      operationId: deleteCustomerSalonReview
      tags: [customer]
      summary: Permanently delete the current customer's review for a salon
      parameters:
        - $ref: "#/components/parameters/SalonId"
      responses:
        "204": { description: Review deleted }
        "403": { description: Customer access required }
        "404": { description: Salon or customer review not found }
  /salon/dashboard:
    get:
      operationId: getSalonDashboard
      tags: [salon-management]
      summary: Active salon or owner-wide dashboard summary
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [location, all]
            default: location
      responses:
        "200":
          description: Salon dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonDashboard"
  /salon/profile:
    get:
      operationId: getManagedSalonProfile
      tags: [salon-management]
      summary: Get editable public profile settings for the active owned salon
      responses:
        "200":
          description: Editable salon profile settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonProfileMedia" }
        "403": { description: Salon-owner access required }
    patch:
      operationId: updateManagedSalonProfile
      tags: [salon-management]
      summary: Update public profile settings for the active owned salon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonProfileMediaUpdate" }
      responses:
        "200":
          description: Updated salon profile settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalonProfileMedia" }
        "400": { description: Invalid profile media }
        "403": { description: Salon-owner access required }
  /media/uploads:
    post:
      operationId: requestMediaUpload
      tags: [media]
      summary: Create an owner-scoped App Storage image upload ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadInput" }
      responses:
        "200":
          description: Short-lived direct upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadTicket" }
        "400": { description: Invalid or unsupported image metadata }
        "403": { description: The current user cannot upload for this scope }
        "413": { description: Image exceeds the upload limit }
  /media/uploads/{uploadId}/finalize:
    post:
      operationId: finalizeMediaUpload
      tags: [media]
      summary: Validate, transform and promote a staged image
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Existing finalized asset (idempotent retry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "201":
          description: Validated and finalized asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
        "400": { description: The staged object is not a valid supported image }
        "403": { description: Upload ticket does not belong to the current user }
        "404": { description: Upload ticket not found }
        "410": { description: Upload ticket expired }
  /media/{assetId}:
    get:
      operationId: getMediaAsset
      tags: [media]
      summary: Serve an optimized image variant using Accept negotiation
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        - name: size
          in: query
          schema: { type: string, enum: [thumbnail, medium, large, original], default: large }
        - name: format
          in: query
          schema: { type: string, enum: [avif, webp, fallback, original] }
        - name: v
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Optimized image bytes
          content:
            image/avif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "304": { description: Not modified }
        "403": { description: Private media access denied }
        "404": { description: Image or requested variant not found }
  /salon/appointments:
    get:
      operationId: listSalonAppointments
      tags: [salon-management]
      summary: List salon appointments
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          description: 1-based page number for stable pagination (date asc, startTime asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of appointments per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Salon appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createSalonAppointment
      tags: [salon-management]
      summary: Create a salon appointment for a CRM customer or walk-in guest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonAppointmentCreate" }
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
  /salon/appointment-series/preview:
    post:
      operationId: previewSalonAppointmentSeries
      tags: [salon-management]
      summary: Check availability for a salon appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesPreviewInput" }
      responses:
        "200":
          description: Availability preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesPreview" }
  /salon/appointment-series:
    post:
      operationId: createSalonAppointmentSeries
      tags: [salon-management]
      summary: Create an atomic salon appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonAppointmentSeriesInput" }
      responses:
        "201":
          description: Created appointment series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesResult" }
  /salon/appointment-series/{seriesId}:
    delete:
      operationId: cancelSalonAppointmentSeries
      tags: [salon-management]
      summary: Cancel incomplete appointments in a salon series from today onward
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled series appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesCancellation" }
  /salon/appointment-series/{seriesId}/move/preview:
    post:
      operationId: previewSalonAppointmentSeriesMove
      tags: [salon-management]
      summary: Preview conflicts before moving all future unfinished appointments in a series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesMoveInput" }
      responses:
        "200":
          description: Series move availability preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesMovePreview" }
  /salon/appointment-series/{seriesId}/move:
    post:
      operationId: moveSalonAppointmentSeries
      tags: [salon-management]
      summary: Atomically move all future unfinished appointments in a series
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesMoveInput" }
      responses:
        "200":
          description: Moved appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesMoveResult" }
  /salon/customers:
    get:
      operationId: listSalonCustomers
      tags: [salon-management]
      summary: List salon CRM customers
      parameters:
        - name: page
          in: query
          description: 1-based page number for stable pagination (lastName asc, firstName asc, id asc).
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: Number of CRM customers per page (1..100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Salon CRM customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCustomer" }
  /employee/appointment-series/preview:
    post:
      operationId: previewEmployeeAppointmentSeries
      tags: [employee-portal]
      summary: Check availability for an employee appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentSeriesPreviewInput" }
      responses:
        "200":
          description: Availability preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesPreview" }
  /employee/appointment-series:
    post:
      operationId: createEmployeeAppointmentSeries
      tags: [employee-portal]
      summary: Create an atomic employee appointment series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeAppointmentSeriesInput" }
      responses:
        "201":
          description: Created appointment series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentSeriesResult" }
  /salon/customers/{customerId}:
    patch:
      operationId: updateSalonCustomer
      tags: [salon-management]
      summary: Update a salon CRM customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string }
