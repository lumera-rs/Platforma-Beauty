    AutomationStats:
      type: object
      properties:
        ruleId: { type: string }
        totalRuns: { type: number }
        sentCount: { type: number }
        skippedCount: { type: number }
        failedCount: { type: number }
        attributedAppointments: { type: number }
        attributedRevenue:
          type: number
          description: Total price (RSD) of appointments attributed to this rule (cancelled and no-show excluded).
        completedAppointments:
          type: number
          description: Attributed appointments already completed (money earned).
        completedRevenue:
          type: number
          description: Price (RSD) of attributed appointments already completed. completedRevenue + upcomingRevenue = attributedRevenue.
        upcomingAppointments:
          type: number
          description: Attributed appointments still upcoming (pending/confirmed).
        upcomingRevenue:
          type: number
          description: Price (RSD) of attributed appointments still upcoming (pending/confirmed). completedRevenue + upcomingRevenue = attributedRevenue.
        cancelledAttributedAppointments:
          type: number
          description: Attributed appointments that were cancelled (excluded from realized numbers).
        cancelledAttributedRevenue:
          type: number
          description: Total price (RSD) of cancelled attributed appointments — revenue lost to cancellations.
        noShowAttributedAppointments:
          type: number
          description: Attributed appointments that became no-shows (excluded from realized numbers).
        noShowAttributedRevenue:
          type: number
          description: Total price (RSD) of no-show attributed appointments — not realized as campaign revenue.
        deliveredCount: { type: number }
        openedCount: { type: number }
        emailSentCount: { type: number }
        emailDeliveredCount: { type: number }
        emailOpenedCount: { type: number }
        emailFailedCount: { type: number }
        smsSentCount: { type: number }
        smsDeliveredCount: { type: number }
        smsFailedCount: { type: number }
        lastRunAt: { type: ["string", "null"], format: date-time }
        previous:
          type: object
          description: Counts for the preceding window of the same length. Present only when compare=previous is combined with a bounded preset or complete custom from/to range.
          properties:
            attributedAppointments: { type: number }
            attributedRevenue:
              type: number
              description: Total price (RSD) of appointments attributed in the preceding window (cancelled and no-show excluded), for the revenue trend.
            noShowAttributedAppointments:
              type: number
              description: Attributed appointments that became no-shows in the preceding window, excluded from realized numbers.
            noShowAttributedRevenue:
              type: number
              description: Total price (RSD) of no-show attributed appointments in the preceding window — not realized as campaign revenue.
            newClientCount:
              type: number
              description: Attributed appointments in the preceding window whose salon client had no completed appointment before the campaign message was sent.
            returningClientCount:
              type: number
              description: Attributed appointments in the preceding window whose salon client had at least one completed appointment before the campaign message was sent.
            knownClientCount:
              type: number
              description: Total attributed appointments from known clients in the preceding window (newClientCount + returningClientCount); clients without a linked salon customer are excluded.
            unknownClientCount:
              type: number
              description: Attributed appointments in the preceding window without a linked salon customer; these are excluded from the known-client denominator.
            newClientShare:
              type: ["number", "null"]
              minimum: 0
              maximum: 100
              description: Percentage of attributed appointments from new clients among appointments with known client history in the preceding window; null when no client history is known.
            emailDeliveredCount: { type: number }
            emailOpenedCount: { type: number }
            smsDeliveredCount: { type: number }
          required: [attributedAppointments, attributedRevenue, noShowAttributedAppointments, noShowAttributedRevenue, newClientCount, returningClientCount, knownClientCount, unknownClientCount, newClientShare, emailDeliveredCount, emailOpenedCount, smsDeliveredCount]
        newClientCount:
          type: number
          description: Attributed appointments from new clients in the requested period.
        knownClientCount:
          type: number
          description: Total attributed appointments from known clients in the requested period (newClientCount + returningClientCount); clients without a linked salon customer are excluded.
        unknownClientCount:
          type: number
          description: Attributed appointments in the requested period without a linked salon customer; these are excluded from the known-client denominator.
        newClientShare:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
          description: Percentage of attributed appointments from new clients among appointments with known client history; unknown clients are excluded from the denominator, and null means no client history is known.
      required: [ruleId, totalRuns, sentCount, skippedCount, failedCount, attributedAppointments, attributedRevenue, completedAppointments, completedRevenue, upcomingAppointments, upcomingRevenue, cancelledAttributedAppointments, cancelledAttributedRevenue, noShowAttributedAppointments, noShowAttributedRevenue, newClientCount, knownClientCount, unknownClientCount, newClientShare, deliveredCount, openedCount, emailSentCount, emailDeliveredCount, emailOpenedCount, emailFailedCount, smsSentCount, smsDeliveredCount, smsFailedCount]

    AutomationAttributedAppointment:
      type: object
      properties:
        appointmentId: { type: string }
        date: { type: string, description: "Appointment date (YYYY-MM-DD)" }
        serviceName: { type: string }
        price:
          type: number
          description: Appointment price in RSD.
        clientFirstName:
          type: ["string", "null"]
          description: First name of the salon client who booked the appointment; null when the appointment has no linked salon customer.
        clientLastName:
          type: ["string", "null"]
          description: Last name of the salon client who booked the appointment; null when the appointment has no linked salon customer.
        isReturning:
          type: ["boolean", "null"]
          description: True when the salon client had at least one completed appointment before this campaign message was sent (returning client), false when this is their first appointment at the salon (new client), null when the appointment has no linked salon customer.
        salonCustomerId:
          type: ["string", "null"]
          description: Id of the linked salon customer, for jumping to the owner's client detail view; null when the appointment has no linked salon customer.
      required: [appointmentId, date, serviceName, price, clientFirstName, clientLastName, isReturning, salonCustomerId]

    AutomationAttributedAppointmentsPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AutomationAttributedAppointment" }
        total:
          type: number
          description: Total attributed (non-cancelled) appointments for the rule within the requested period, matching the stats count.
        newClientCount:
          type: number
          description: Attributed appointments (within the requested period) whose salon client had no completed appointment before the campaign message was sent — new clients the campaign brought in. The summary counts always cover the whole attributed set for the window, ignoring any clientType filter, so newClientCount + returningClientCount + unknownClientCount equals the unfiltered total.
        returningClientCount:
          type: number
          description: Attributed appointments (within the requested period) whose salon client already had at least one completed appointment before the campaign message was sent — returning clients the campaign won back. Ignores any clientType filter.
        unknownClientCount:
          type: number
          description: Attributed appointments (within the requested period) without a linked salon customer, so the new/returning split is unknown for them. Ignores any clientType filter.
        limit:
          type: number
          description: Page size actually applied by the server.
        offset:
          type: number
          description: Offset actually applied by the server.
      required: [items, total, newClientCount, returningClientCount, unknownClientCount, limit, offset]

