  /growth/my-purchases/{purchaseId}/redeem:
    post:
      operationId: customerRedeemPackageSession
      tags: [growth]
      summary: Redeem one session from a package against an appointment (customer)
      parameters:
        - name: purchaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemSessionBody" }
      responses:
        "200":
          description: Session redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemSessionResult" }
        "400": { description: Validation error }
        "401": { description: Authentication required }
        "403": { description: Access denied (purchase not owned by caller) }
        "404": { description: Purchase not found }
        "409":
          description: >-
            Redemption not allowed. Carries the stable package-error
            discriminator `code: PACKAGE_ERROR` plus the specific `reason`
            (e.g. appointment_not_eligible, already_redeemed, no_sessions_left,
            expired, not_active, service_not_covered).
