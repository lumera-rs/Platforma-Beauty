  /growth/automations/{automationId}/stats:
    get:
      operationId: ownerGetAutomationStats
      tags: [growth]
      summary: Get run statistics for an automation rule (owner)
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          description: Time window for run/delivery aggregation (defaults to all time)
          schema: { type: string, enum: [7d, 30d, 90d, all] }
        - name: from
          in: query
          description: Custom window start date (inclusive, YYYY-MM-DD); cannot be combined with period
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Custom window end date (inclusive, YYYY-MM-DD); cannot be combined with period
          schema: { type: string, format: date }
        - name: compare
          in: query
          description: Set to "previous" to also return counts for the preceding window of the same length. Requires a bounded period (7d, 30d, 90d).
          schema: { type: string, enum: [previous] }
      responses:
        "200":
          description: Automation stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationStats" }
        "400": { description: Invalid period or date range }
        "404": { description: Not found }

  /growth/automations/{automationId}/attributed-appointments:
    get:
      operationId: ownerListAutomationAttributedAppointments
      tags: [growth]
      summary: List the concrete appointments attributed to an automation rule (owner, paginated)
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          description: Time window for run attribution, matching the stats endpoints (defaults to all time)
          schema: { type: string, enum: [7d, 30d, 90d, all] }
        - name: from
          in: query
          description: Custom window start date (inclusive, YYYY-MM-DD); cannot be combined with period
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Custom window end date (inclusive, YYYY-MM-DD); cannot be combined with period
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: Page size (defaults to 25, maximum 100)
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          description: Number of rows to skip (defaults to 0)
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: One page of attributed appointments (date, service, price in RSD), newest first, plus the total count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationAttributedAppointmentsPage" }
        "400": { description: "Invalid period, limit, or offset" }
        "401": { description: Authentication required }
        "403": { description: Salon owner required }
        "404": { description: Not found }

  /growth/automation-stats:
