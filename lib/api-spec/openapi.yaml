      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrowthAiQuestionBody" }
      responses:
        "200":
          description: AI answer with auditable snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowthAiAnswer" }
