          properties:
            recentAppointments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  date: { type: string, format: date }
                  status: { type: string }
                  price: { type: number }
                  serviceName: { type: string }
                required: [id, date, status, price, serviceName]
          required: [recentAppointments]

    ReversalResult:
      type: object
      properties:
        remainingSessions: { type: number }
      required: [remainingSessions]

    RetentionThresholds:
      type: object
      properties:
        newCustomerWindowDays: { type: number, minimum: 1, maximum: 365, multipleOf: 1, description: "A single completed visit within this many days still counts as NEW" }
        defaultIntervalDays: { type: number, minimum: 1, maximum: 365, multipleOf: 1, description: "Assumed visit interval (days) when fewer than 2 completed visits exist" }
        atRiskIntervalPercent: { type: number, minimum: 100, maximum: 1000, multipleOf: 1, description: "AT_RISK when overdue beyond typical interval × this percent (150 = 1.5×)" }
        lostIntervalPercent: { type: number, minimum: 100, maximum: 2000, multipleOf: 1, description: "LOST when overdue beyond typical interval × this percent (250 = 2.5×); must exceed atRiskIntervalPercent" }
        lostMinimumDays: { type: number, minimum: 1, maximum: 1095, multipleOf: 1, description: "LOST never triggers before this many days since the last visit" }
        vipMinCompletedVisits: { type: number, minimum: 1, maximum: 100, multipleOf: 1, description: "VIP when the customer has at least this many completed visits" }
        vipSpendPercentOfMedian: { type: number, minimum: 100, maximum: 1000, multipleOf: 1, description: "VIP when total spend exceeds salon median × this percent (200 = 2×)" }
      required: [newCustomerWindowDays, defaultIntervalDays, atRiskIntervalPercent, lostIntervalPercent, lostMinimumDays, vipMinCompletedVisits, vipSpendPercentOfMedian]

    RetentionSettings:
      type: object
      properties:
        version: { type: number, description: "Active settings version; 0 means platform defaults (no admin change yet)" }
        thresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        changedByUserId: { type: ["string", "null"] }
        changedAt: { type: ["string", "null"], description: "ISO timestamp of the change; null for platform defaults" }
        isDefault: { type: boolean }
        defaults: { $ref: "#/components/schemas/RetentionThresholds" }
        changeSource: { type: string, enum: [manual, restore_version, restore_defaults], description: "How the active version came to be: hand-edited, restored from an earlier version, or restored platform defaults" }
        restoredFromVersion: { type: ["number", "null"], description: "Source version when changeSource is restore_version; null otherwise" }
      required: [version, thresholds, changedByUserId, changedAt, isDefault, defaults, changeSource, restoredFromVersion]

    RetentionStatusCounts:
      type: object
      properties:
        NEW: { type: number }
        ACTIVE: { type: number }
        VIP: { type: number }
        AT_RISK: { type: number }
        LOST: { type: number }
      required: [NEW, ACTIVE, VIP, AT_RISK, LOST]

    RetentionReclassificationShift:
      type: object
      properties:
        fromStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        toStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        count: { type: number, description: "Customers that would move fromStatus → toStatus" }
      required: [fromStatus, toStatus, count]

    RetentionPreviewAffectedSalon:
      type: object
      properties:
        salonId: { type: string }
        salonName: { type: string }
        reclassifiedCount: { type: number, description: "Customers of this salon whose status would change under the candidate thresholds" }
        totalCustomers: { type: number, description: "Total customers this salon has — puts the reclassified count in proportion" }
      required: [salonId, salonName, reclassifiedCount, totalCustomers]

    RetentionSettingsPreview:
      type: object
      properties:
        currentVersion: { type: number, description: "Settings version the current counts were computed against (0 = platform defaults)" }
        totalCustomers: { type: number, description: "Salon customers evaluated platform-wide" }
        reclassifiedCount: { type: number, description: "Customers whose status would change under the candidate thresholds" }
        currentCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        candidateCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        shifts:
          type: array
          description: "Status moves under the candidate thresholds, largest first"
          items: { $ref: "#/components/schemas/RetentionReclassificationShift" }
        topAffectedSalons:
          type: array
          description: "Salons with the most reclassified customers, largest first (top 10)"
          items: { $ref: "#/components/schemas/RetentionPreviewAffectedSalon" }
      required: [currentVersion, totalCustomers, reclassifiedCount, currentCounts, candidateCounts, shifts, topAffectedSalons]

    RetentionSettingsUpdate:
      allOf:
        - $ref: "#/components/schemas/RetentionThresholds"
        - type: object
          properties:
            changeSource:
              type: string
              enum: [manual, restore_version, restore_defaults]
              description: "How this version came to be; defaults to manual. restore_version requires restoredFromVersion and thresholds identical to that version; restore_defaults requires thresholds identical to the platform defaults"
            restoredFromVersion:
              type: number
              minimum: 1
              multipleOf: 1
              description: "Version whose values are being restored; only allowed (and required) when changeSource is restore_version"
            expectedVersion:
              type: number
              minimum: 0
              multipleOf: 1
              description: "Active settings version this edit was based on (0 = platform defaults); the server rejects with 409 when a newer version exists"
          required: [expectedVersion]

    RetentionSettingsVersionConflict:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [VERSION_CONFLICT] }
        expectedVersion: { type: number, description: "Version the client based its edit on" }
        activeVersion: { type: number, description: "Version currently active on the server" }
      required: [error, code, expectedVersion, activeVersion]

    RetentionSettingsHistoryEntry:
      type: object
      properties:
        version: { type: number }
        thresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        previousThresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        changedByUserId: { type: ["string", "null"] }
        changedByName: { type: ["string", "null"] }
        changedAt: { type: string, description: "ISO timestamp of the change" }
        changeSource: { type: string, enum: [manual, restore_version, restore_defaults], description: "How the version came to be: hand-edited, restored from an earlier version, or restored platform defaults" }
        restoredFromVersion: { type: ["number", "null"], description: "Source version when changeSource is restore_version; null otherwise" }
      required: [version, thresholds, previousThresholds, changedByUserId, changedByName, changedAt, changeSource, restoredFromVersion]

    GrowthAdminSummary:
      type: object
      properties:
        automation:
          type: object
          properties:
            totalRules: { type: number }
            activeRules: { type: number }
            byStatus:
              type: object
              additionalProperties: { type: number }
          required: [totalRules, activeRules, byStatus]
        packages:
          type: object
          properties:
            total: { type: number }
            active: { type: number }
          required: [total, active]
        purchases:
          type: object
          properties:
            total: { type: number }
            active: { type: number }
            pendingPayment: { type: number }
          required: [total, active, pendingPayment]
      required: [automation, packages, purchases]
