        aiProposed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, salonId, name, trigger, triggerConfig, action, status, aiProposed, createdAt, updatedAt]

    CreateAutomationRuleBody:
