          type: object
          properties:
            line1: { type: string, minLength: 3, maxLength: 200 }
            city: { type: string, minLength: 2, maxLength: 100 }
            postalCode: { type: string, maxLength: 20 }
            details: { type: string, maxLength: 300 }
          required: [line1, city]
