        employeeId: { type: string }
        commissionType: { type: string, enum: [percent_of_revenue, fixed_per_treatment] }
        commissionPercent: { type: number }
        fixedAmountInDinars: { type: number }
        perServiceOverrides:
          type: object
          additionalProperties: { type: number }
        updatedAt: { type: string, format: date-time }
      required: [id, salonId, employeeId, commissionType, commissionPercent, fixedAmountInDinars, perServiceOverrides, updatedAt]

    UpdateCommissionBody:
      type: object
      additionalProperties: false
      properties:
        commissionType: { type: string, enum: [percent_of_revenue, fixed_per_treatment] }
