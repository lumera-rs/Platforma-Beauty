        action: { type: string, enum: [send_email, send_sms, send_email_and_sms] }
        emailSubject: { type: ["string", "null"] }
        emailBody: { type: ["string", "null"] }
        smsBody: { type: ["string", "null"] }
        voucherCode: { type: ["string", "null"], description: "Optional discount/voucher code substituted into {{voucherCode}} template placeholders" }
