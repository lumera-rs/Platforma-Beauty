        "404": { description: Referral review not found }
        "409": { description: Review was already resolved or the requested decision conflicts with terminal referral lifecycle }
components:
  parameters:
    CityQuery:
      name: city
      in: query
      schema: { type: string }
    CategoryQuery:
      name: category
      in: query
      schema: { type: string }
    TreatmentQuery:
      name: treatment
      in: query
      schema: { type: string }
    SortQuery:
      name: sort
      in: query
      schema: { type: string, enum: [recommended, top-rated, cheapest, largest-discount, nearest, first-available, most-popular, most-booked-recently, newest], default: recommended }
    SalonSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SalonId:
      name: salonId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string }
    ModuleId:
      name: moduleId
      in: path
      required: true
      schema: { type: string }
    LessonId:
      name: lessonId
      in: path
      required: true
      schema: { type: string }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string }
    EducationCenterId:
      name: centerId
      in: path
      required: true
      schema: { type: string }
    EducationDisputeId:
      name: disputeId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    WaitlistId:
      name: waitlistId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ProductWaitlistSubscription:
      type: object
      required: [id, status, subscribed]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, NOTIFIED, UNSUBSCRIBED] }
        subscribed: { type: boolean }
    ProductWaitlistStatus:
      type: object
      required: [subscribed, status, notifiedAt]
      properties:
        subscribed: { type: boolean }
        status: { type: [string, "null"], enum: [ACTIVE, NOTIFIED, UNSUBSCRIBED, null] }
        notifiedAt: { type: [string, "null"], format: date-time }
    AdminProductWaitlistPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, audience, status, notifiedAt, createdAt, product, salon, customer]
            properties:
              id: { type: string }
              audience: { type: string, enum: [B2B, B2C] }
              status: { type: string, enum: [ACTIVE, NOTIFIED, UNSUBSCRIBED] }
              notifiedAt: { type: [string, "null"], format: date-time }
              createdAt: { type: string, format: date-time }
              product:
                type: object
                required: [id, name, sku, catalogReference]
                properties:
                  id: { type: string }
                  name: { type: string }
                  sku: { type: string }
                  catalogReference: { type: string }
              salon:
                type: [object, "null"]
                properties:
                  id: { type: string }
                  name: { type: string }
              customer:
                type: [object, "null"]
                properties:
                  id: { type: string }
                  firstName: { type: string }
                  lastName: { type: string }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    ReferralCodeValidation:
      type: object
      properties:
        valid: { type: boolean }
        code: { type: string }
        channel: { type: string, enum: [A, B1, B2, C, D] }
        link: { type: string }
      required: [valid, code, channel, link]
    ReferralChannelSummary:
      type: object
      properties:
        channel: { type: string, enum: [A, B1, B2, C, D] }
        sourceBusinessId: { type: ["string", "null"] }
        sourceBusinessKind: { type: string, enum: [account, salon, education_center] }
        sourceBusinessName: { type: string }
        code: { type: string }
        link: { type: string, format: uri }
        qualified: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        terms: { type: string }
        cap:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ReferralChannelCap"
      required: [channel, sourceBusinessId, sourceBusinessKind, sourceBusinessName, code, link, qualified, pending, terms, cap]
    ReferralChannelCap:
      type: object
      properties:
        limit: { type: integer, minimum: 1 }
        used: { type: integer, minimum: 0 }
        period: { type: string, enum: [calendar_month, calendar_week] }
      required: [limit, used, period]
    ReferralLedgerEntry:
      type: object
      properties:
        id: { type: string }
