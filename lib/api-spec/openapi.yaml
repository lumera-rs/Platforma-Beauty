          type: object
          additionalProperties: { type: number }
      required: [commissionType]

    GrowthAiQuestionBody:
      type: object
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        snapshotPeriodDays: { type: number, minimum: 7, maximum: 365, multipleOf: 1 }
      required: [question]

    GrowthAiAnswer:
      type: object
      properties:
        answer: { type: string }
        snapshot: { $ref: "#/components/schemas/SalonMetricSnapshot" }
      required: [answer, snapshot]

    SalonMetricSnapshot:
      type: object
      properties:
        salonId: { type: string }
        salonName: { type: string }
        periodFrom: { type: string }
        periodTo: { type: string }
        generatedAt: { type: string, format: date-time }
        totalRevenue: { type: number }
        totalBookings: { type: number }
        completedBookings: { type: number }
        cancelledBookings: { type: number }
        noShowBookings: { type: number }
        retentionCounts:
          type: object
          properties:
            NEW: { type: number }
            ACTIVE: { type: number }
            VIP: { type: number }
            AT_RISK: { type: number }
            LOST: { type: number }
          required: [NEW, ACTIVE, VIP, AT_RISK, LOST]
        topServices:
          type: array
          items:
            type: object
            properties:
              serviceName: { type: string }
              bookingCount: { type: number }
              revenue: { type: number }
            required: [serviceName, bookingCount, revenue]
        topEmployees:
          type: array
          items:
            type: object
            properties:
              employeeName: { type: string }
              completedCount: { type: number }
              revenue: { type: number }
            required: [employeeName, completedCount, revenue]
        totalCustomers: { type: number }
      required: [salonId, salonName, periodFrom, periodTo, generatedAt, totalRevenue, totalBookings, completedBookings, cancelledBookings, noShowBookings, retentionCounts, topServices, topEmployees, totalCustomers]

    RetentionCustomer:
      type: object
      properties:
        salonCustomerId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        birthDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        completedCount: { type: number }
        lastVisitDaysAgo: { type: ["number", "null"] }
        typicalIntervalDays: { type: ["number", "null"] }
        totalSpend: { type: number }
        hasFutureAppointment: { type: boolean }
        explanation: { type: string }
        recommendedAction: { type: string }
      required: [salonCustomerId, firstName, lastName, status, completedCount, totalSpend, hasFutureAppointment, explanation, recommendedAction]

    RetentionCustomerDetail:
      allOf:
        - $ref: "#/components/schemas/RetentionCustomer"
        - type: object
          properties:
            recentAppointments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  date: { type: string, format: date }
                  status: { type: string }
                  price: { type: number }
                  serviceName: { type: string }
                required: [id, date, status, price, serviceName]
          required: [recentAppointments]

    ReversalResult:
      type: object
      properties:
        remainingSessions: { type: number }
      required: [remainingSessions]

    RetentionThresholds:
      type: object
      properties:
        newCustomerWindowDays: { type: number, minimum: 1, maximum: 365, multipleOf: 1, description: "A single completed visit within this many days still counts as NEW" }
        defaultIntervalDays: { type: number, minimum: 1, maximum: 365, multipleOf: 1, description: "Assumed visit interval (days) when fewer than 2 completed visits exist" }
        atRiskIntervalPercent: { type: number, minimum: 100, maximum: 1000, multipleOf: 1, description: "AT_RISK when overdue beyond typical interval × this percent (150 = 1.5×)" }
        lostIntervalPercent: { type: number, minimum: 100, maximum: 2000, multipleOf: 1, description: "LOST when overdue beyond typical interval × this percent (250 = 2.5×); must exceed atRiskIntervalPercent" }
        lostMinimumDays: { type: number, minimum: 1, maximum: 1095, multipleOf: 1, description: "LOST never triggers before this many days since the last visit" }
        vipMinCompletedVisits: { type: number, minimum: 1, maximum: 100, multipleOf: 1, description: "VIP when the customer has at least this many completed visits" }
        vipSpendPercentOfMedian: { type: number, minimum: 100, maximum: 1000, multipleOf: 1, description: "VIP when total spend exceeds salon median × this percent (200 = 2×)" }
      required: [newCustomerWindowDays, defaultIntervalDays, atRiskIntervalPercent, lostIntervalPercent, lostMinimumDays, vipMinCompletedVisits, vipSpendPercentOfMedian]

    RetentionSettings:
      type: object
      properties:
        version: { type: number, description: "Active settings version; 0 means platform defaults (no admin change yet)" }
        thresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        changedByUserId: { type: ["string", "null"] }
        changedByName: { type: ["string", "null"], description: "Resolved display name of the admin who made the change; null for platform defaults or when the user is unknown" }
        changedAt: { type: ["string", "null"], description: "ISO timestamp of the change; null for platform defaults" }
        isDefault: { type: boolean }
        defaults: { $ref: "#/components/schemas/RetentionThresholds" }
        changeSource: { type: string, enum: [manual, restore_version, restore_defaults], description: "How the active version came to be: hand-edited, restored from an earlier version, or restored platform defaults" }
        restoredFromVersion: { type: ["number", "null"], description: "Source version when changeSource is restore_version; null otherwise" }
      required: [version, thresholds, changedByUserId, changedByName, changedAt, isDefault, defaults, changeSource, restoredFromVersion]

    RetentionStatusCounts:
      type: object
      properties:
        NEW: { type: number }
        ACTIVE: { type: number }
        VIP: { type: number }
        AT_RISK: { type: number }
        LOST: { type: number }
      required: [NEW, ACTIVE, VIP, AT_RISK, LOST]

    RetentionReclassificationShift:
      type: object
      properties:
        fromStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        toStatus: { type: string, enum: [NEW, ACTIVE, VIP, AT_RISK, LOST] }
        count: { type: number, description: "Customers that would move fromStatus → toStatus" }
      required: [fromStatus, toStatus, count]

    RetentionPreviewAffectedSalon:
      type: object
      properties:
        salonId: { type: string }
        salonName: { type: string }
        reclassifiedCount: { type: number, description: "Customers of this salon whose status would change under the candidate thresholds" }
        totalCustomers: { type: number, description: "Total customers this salon has — puts the reclassified count in proportion" }
        reclassifiedCountMarginOfError:
          type: ["number", "null"]
          description: "Approximate 95% Wilson margin of error for reclassifiedCount in a stratified estimate; null for exact counts and full-salon censuses"
        sampleSize:
          type: ["number", "null"]
          description: "Customers classified for this salon in a stratified estimate; null for exact counts"
      required: [salonId, salonName, reclassifiedCount, totalCustomers, reclassifiedCountMarginOfError, sampleSize]

    RetentionSettingsPreview:
      type: object
      properties:
        currentVersion: { type: number, description: "Settings version the current counts were computed against (0 = platform defaults)" }
        totalCustomers: { type: number, description: "Salon customers evaluated platform-wide" }
        reclassifiedCount: { type: number, description: "Customers whose status would change under the candidate thresholds" }
        reclassifiedCountMarginOfError:
          type: ["number", "null"]
          description: "Approximate 95% margin of error for reclassifiedCount when isEstimate is true; null in exact mode"
        currentCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        currentCountMarginsOfError:
          oneOf:
            - $ref: "#/components/schemas/RetentionStatusCounts"
            - type: "null"
          description: "Approximate 95% Wilson margin of error for each current status count when isEstimate is true; null in exact mode"
        candidateCounts: { $ref: "#/components/schemas/RetentionStatusCounts" }
        candidateCountMarginsOfError:
          oneOf:
            - $ref: "#/components/schemas/RetentionStatusCounts"
            - type: "null"
          description: "Approximate 95% Wilson margin of error for each candidate status count when isEstimate is true; null in exact mode"
        shifts:
          type: array
          description: "Status moves under the candidate thresholds, largest first"
          items: { $ref: "#/components/schemas/RetentionReclassificationShift" }
        topAffectedSalons:
          type: array
          description: "Salons with the most reclassified customers, largest first (top 10); estimate mode returns rows only when salonRankingAvailable is true"
          items: { $ref: "#/components/schemas/RetentionPreviewAffectedSalon" }
        topShareAffectedSalons:
          type: array
          description: "Salons with the highest SHARE of reclassified customers, largest first (top 10); only salons with at least shareRankingMinCustomers customers qualify; estimate mode returns rows only when salonRankingAvailable is true"
          items: { $ref: "#/components/schemas/RetentionPreviewAffectedSalon" }
        shareRankingMinCustomers: { type: number, description: "Minimum customers a salon needs to qualify for the share-based ranking" }
        isEstimate:
          type: boolean
          description: "True when the platform exceeded the exact-preview cap and counts are approximate; render such values as approximate (~), never as exact. Salon rankings are returned only when salonRankingAvailable is true for the opt-in stratified design."
        sampleSize:
          type: ["number", "null"]
          description: "Customers actually classified when isEstimate is true; null in exact mode"
        salonRankingAvailable:
          type: boolean
          description: "True for exact previews and for estimate previews backed by the opt-in stratified per-salon sample; false means per-salon rankings are intentionally unavailable"
      required: [currentVersion, totalCustomers, reclassifiedCount, reclassifiedCountMarginOfError, currentCounts, currentCountMarginsOfError, candidateCounts, candidateCountMarginsOfError, shifts, topAffectedSalons, topShareAffectedSalons, shareRankingMinCustomers, isEstimate, sampleSize, salonRankingAvailable]

    RetentionSettingsUpdate:
      allOf:
        - $ref: "#/components/schemas/RetentionThresholds"
        - type: object
          properties:
            changeSource:
              type: string
              enum: [manual, restore_version, restore_defaults]
              description: "How this version came to be; defaults to manual. restore_version requires restoredFromVersion and thresholds identical to that version; restore_defaults requires thresholds identical to the platform defaults"
            restoredFromVersion:
              type: number
              minimum: 1
              multipleOf: 1
              description: "Version whose values are being restored; only allowed (and required) when changeSource is restore_version"
            expectedVersion:
              type: number
              minimum: 0
              multipleOf: 1
              description: "Active settings version this edit was based on (0 = platform defaults); the server rejects with 409 when a newer version exists"
          required: [expectedVersion]

    RetentionSettingsVersionConflict:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [VERSION_CONFLICT] }
        expectedVersion: { type: number, description: "Version the client based its edit on" }
        activeVersion: { type: number, description: "Version currently active on the server" }
        changedByName: { type: ["string", "null"], description: "Display name of the administrator who saved the winning version; null when platform defaults are active or the user is unknown" }
        changedAt: { type: ["string", "null"], description: "ISO timestamp of the winning version; null when platform defaults are active" }
      required: [error, code, expectedVersion, activeVersion, changedByName, changedAt]

    RetentionSettingsHistoryEntry:
      type: object
      properties:
        version: { type: number }
        thresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        previousThresholds: { $ref: "#/components/schemas/RetentionThresholds" }
        changedByUserId: { type: ["string", "null"] }
        changedByName: { type: ["string", "null"] }
        changedAt: { type: string, description: "ISO timestamp of the change" }
        changeSource: { type: string, enum: [manual, restore_version, restore_defaults], description: "How the version came to be: hand-edited, restored from an earlier version, or restored platform defaults" }
        restoredFromVersion: { type: ["number", "null"], description: "Source version when changeSource is restore_version; null otherwise" }
      required: [version, thresholds, previousThresholds, changedByUserId, changedByName, changedAt, changeSource, restoredFromVersion]

    GrowthAdminSummary:
      type: object
      properties:
