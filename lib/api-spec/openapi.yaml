openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LUMERA beauty, wellness, booking, B2B, loyalty, and education marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: salons
  - name: appointments
  - name: customer
  - name: salon-management
  - name: shop
  - name: loyalty
  - name: education
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /salons:
    get:
      operationId: listSalons
      tags: [salons]
      summary: Search salons
      parameters:
        - $ref: "#/components/parameters/CityQuery"
        - $ref: "#/components/parameters/CategoryQuery"
        - $ref: "#/components/parameters/TreatmentQuery"
        - $ref: "#/components/parameters/SortQuery"
        - name: priceMax
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: availability
          in: query
          schema: { type: string, enum: [today, tomorrow, this-week] }
        - name: homeService
          in: query
          schema: { type: boolean }
        - name: gender
          in: query
          schema: { type: string, enum: [all, women, men, everyone] }
      responses:
        "200":
          description: Salon results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
  /salons/{slug}:
    get:
      operationId: getSalon
      tags: [salons]
      summary: Get salon profile
      parameters:
        - $ref: "#/components/parameters/SalonSlug"
      responses:
        "200":
          description: Salon profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonProfile"
  /salons/{salonId}/availability:
    get:
      operationId: getSalonAvailability
      tags: [salons]
      summary: Get available booking slots
      parameters:
        - $ref: "#/components/parameters/SalonId"
        - name: serviceId
          in: query
          required: true
          schema: { type: string }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeSlot" }
  /appointments:
    get:
      operationId: listMyAppointments
      tags: [appointments]
      summary: List appointments for the signed-in user
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, completed, cancelled, no-show] }
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: all }
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{appointmentId}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Reschedule or update appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel appointment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAppointmentInput"
      responses:
        "200":
          description: Cancelled appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /customer/dashboard:
    get:
      operationId: getCustomerDashboard
      tags: [customer]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Customer dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"
  /customer/favorites:
    get:
      operationId: listFavorites
      tags: [customer]
      summary: List favorite salons
      responses:
        "200":
          description: Favorite salons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalonCard" }
    post:
      operationId: toggleFavorite
      tags: [customer]
      summary: Add or remove a favorite salon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResult"
  /salon/dashboard:
    get:
      operationId: getSalonDashboard
      tags: [salon-management]
      summary: Salon dashboard summary
      responses:
        "200":
          description: Salon dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalonDashboard"
  /salon/appointments:
    get:
      operationId: listSalonAppointments
      tags: [salon-management]
      summary: List salon appointments
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Salon appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
  /salon/appointments/{appointmentId}:
    patch:
      operationId: updateSalonAppointment
      tags: [salon-management]
      summary: Update appointment status or assignment
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalonAppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /salon/services:
    get:
      operationId: listSalonServices
      tags: [salon-management]
      summary: List salon services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
    post:
      operationId: createSalonService
      tags: [salon-management]
      summary: Create service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /salon/employees:
    get:
      operationId: listSalonEmployees
      tags: [salon-management]
      summary: List salon employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
  /shop/products:
    get:
      operationId: listProducts
      tags: [shop]
      summary: List professional products
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /shop/summary:
    get:
      operationId: getShopSummary
      tags: [shop]
      summary: Salon shop and loyalty progress
      responses:
        "200":
          description: Shop summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSummary"
  /shop/orders:
    get:
      operationId: listOrders
      tags: [shop]
      summary: List salon orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [shop]
      summary: Create B2B order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /loyalty/status:
    get:
      operationId: getLoyaltyStatus
      tags: [loyalty]
      summary: Get current partnership tier
      responses:
        "200":
          description: Loyalty status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyStatus"
  /education/courses:
    get:
      operationId: listCourses
      tags: [education]
      summary: Browse education courses
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [online, in-person, hybrid] }
        - name: city
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /education/enrollments:
    get:
      operationId: listEnrollments
      tags: [education]
      summary: List course enrollments
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enrollment" }
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Admin platform overview with aggregates and trends
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/salons:
    get:
      operationId: adminListSalons
      tags: [admin]
      summary: Searchable/filterable salon list with subscription and loyalty details
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: subscriptionStatus
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Admin salon list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSalon" }
  /admin/salons/{salonId}:
    patch:
      operationId: adminUpdateSalon
      tags: [admin]
      summary: Update salon active or featured status
      parameters:
        - $ref: "#/components/parameters/SalonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSalonUpdate"
      responses:
        "200":
          description: Updated salon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSalon"
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Searchable/filterable user list with role and active status
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            type: string
            enum: [SUPER_ADMIN, ADMIN, SALON_OWNER, SALON_EMPLOYEE, EDUCATION_CENTER_OWNER, INSTRUCTOR, CUSTOMER]
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Admin user list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user role or active status (protects last active SUPER_ADMIN)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/loyalty-tiers:
    get:
      operationId: adminListLoyaltyTiers
      tags: [admin]
      summary: List all loyalty tiers
      responses:
        "200":
          description: Loyalty tiers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoyaltyTier" }
    post:
      operationId: adminCreateLoyaltyTier
      tags: [admin]
      summary: Create a loyalty tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyTierInput"
      responses:
        "201":
          description: Created loyalty tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyTier"
  /admin/loyalty-tiers/{tierId}:
    patch:
      operationId: adminUpdateLoyaltyTier
      tags: [admin]
      summary: Update or deactivate a loyalty tier
      parameters:
        - name: tierId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyTierInput"
      responses:
        "200":
          description: Updated loyalty tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyTier"
    delete:
      operationId: adminDeleteLoyaltyTier
      tags: [admin]
      summary: Delete or deactivate a loyalty tier
      parameters:
        - name: tierId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Deleted/deactivated loyalty tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyTier"
  /admin/subscription-plans:
    get:
      operationId: adminListSubscriptionPlans
      tags: [admin]
      summary: List all subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubscriptionPlan" }
    post:
      operationId: adminCreateSubscriptionPlan
      tags: [admin]
      summary: Create a subscription plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanInput"
      responses:
        "201":
          description: Created subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
  /admin/subscription-plans/{planId}:
    patch:
      operationId: adminUpdateSubscriptionPlan
      tags: [admin]
      summary: Update or deactivate a subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlanInput"
      responses:
        "200":
          description: Updated subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
    delete:
      operationId: adminDeleteSubscriptionPlan
      tags: [admin]
      summary: Delete or deactivate a subscription plan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "200":
          description: Deleted/deactivated subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
  /admin/reviews:
    get:
      operationId: adminListReviews
      tags: [admin]
      summary: List reviews with salon and customer context
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: salonId
          in: query
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        - name: visible
          in: query
          schema: { type: boolean }
        - name: minRating
          in: query
          schema: { type: number, minimum: 1, maximum: 5 }
        - name: maxRating
          in: query
          schema: { type: number, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Admin review list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminReview" }
  /admin/reviews/{reviewId}:
    patch:
      operationId: adminUpdateReview
      tags: [admin]
      summary: Moderate review visibility
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewUpdate"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReview"
    delete:
      operationId: adminDeleteReview
      tags: [admin]
      summary: Permanently delete a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      responses:
        "204":
          description: Review deleted
components:
  parameters:
    CityQuery:
      name: city
      in: query
      schema: { type: string }
    CategoryQuery:
      name: category
      in: query
      schema: { type: string }
    TreatmentQuery:
      name: treatment
      in: query
      schema: { type: string }
    SortQuery:
      name: sort
      in: query
      schema: { type: string, enum: [recommended, top-rated, cheapest, nearest, first-available, most-popular], default: recommended }
    SalonSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    SalonId:
      name: salonId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    User:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, SALON_OWNER, SALON_EMPLOYEE, EDUCATION_CENTER_OWNER, INSTRUCTOR, CUSTOMER]
        active: { type: boolean }
      required: [id, firstName, lastName, email, role, active]
    RegisterInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string }
        password: { type: string, minLength: 8 }
        phone: { type: string }
        role:
          type: string
          enum: [CUSTOMER, SALON_OWNER, EDUCATION_CENTER_OWNER]
      required: [firstName, lastName, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string, minLength: 1 }
      required: [email, password]
    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        message: { type: string }
      required: [user, message]
    CurrentUserResponse:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]
    SalonCard:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        city: { type: string }
        municipality: { type: string }
        address: { type: string }
        imageUrl: { type: string }
        rating: { type: number }
        reviewCount: { type: number }
        shortDescription: { type: string }
        popularServices:
          type: array
          items: { type: string }
        startingPrice: { type: number }
        earliestSlot: { type: ["string", "null"] }
        homeService: { type: boolean }
        featured: { type: boolean }
